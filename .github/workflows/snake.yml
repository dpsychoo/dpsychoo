name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7.0.1

      - name: Generate dark and light contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dpsychoo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?color_snake=#A78BFA&color_dots=#2D3343,#4B5563,#7C3AED,#A78BFA,#22D3EE
            dist/snake-light.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#C4B5FD,#A78BFA,#7C3AED,#0E7490

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
