<svg xmlns="http://www.w3.org/2000/svg" width="328" height="736" viewBox="0 0 328 736" role="img" aria-labelledby="title desc">
  <title id="title">SGODX qualitative focus radar pair - dark theme, narrow layout</title>
  <desc id="desc">Two approved qualitative professional-focus radars in a vertical layout. The classifications are owner-approved descriptions informed by public project context where available; public material does not independently verify private work. CORE means primary current focus; SUPPORTING means complementary documented work; EXPLORING means a developing or future area; UNASSESSED means no owner-approved category is assigned. Radial distance shows categorical focus priority only, never proficiency, performance, seniority, or certification. UNASSESSED dimensions have no plotted point. PRODUCT &amp; FRONTEND ENGINEERING: TypeScript, SUPPORTING; React / UI Components, SUPPORTING; Interface Engineering, CORE; Responsive Interfaces, SUPPORTING; Interactive Experiences, CORE; Product Engineering, CORE. PLATFORM, DATA &amp; AUTOMATION: Backend / APIs, SUPPORTING; PostgreSQL / Data, EXPLORING; Supabase, SUPPORTING; AI Integrations, SUPPORTING; Automation, EXPLORING; Cloud Deployment, SUPPORTING.</desc>
